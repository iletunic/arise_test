site_name: Arise testing

nav:
  - Intro: 'index.md'
  - Courses: 
    - Course 1: '!include ./courses/course1/mkdocs.yml'
    - Course 2: '!include ./courses/course2/mkdocs.yml'
    - Course 3: '!include ./courses/course3/mkdocs.yml'

plugins:
  - monorepo
  - mkdocs-video # embed videos to the docs
  - bibtex:
     bib_dir: "ref"

theme:
  name: material
  logo: assets_all/images/ARISE2_logo_RGB.png
  favicon: assets_all/images/ARISE2_logo_RGB.png
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.footer
    - toc.integrate
  font: 
    text: Lato

# Repository
repo_name: iletunic/arise_test
repo_url: https://github.com/iletunic/arise_test
edit_uri: edit/main/docs/

  
# Footer
copyright: copyright here

markdown_extensions:
  - abbr
  - def_list
  - footnotes
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - sane_lists
  - smarty
  - toc:
      toc_depth: 3
  - pymdownx.superfences
  - attr_list
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - neoteroi.cards
  - addbioschemas

extra_css:
  - stylesheets/extra.css
  - stylesheets/neoteroi-mkdocs.css
